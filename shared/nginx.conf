# /opt/shared/nginx.conf
# =============================================================================
# Shared reverse proxy for all apps on this VM.
#
# This file is mounted at /etc/nginx/conf.d/default.conf, i.e. it is INCLUDED
# inside the stock nginx http{} block — so it must contain http-context
# directives only (upstream / map / server), NOT events{} or http{}.
#
# Upstream/target names use UNDERSCORES (nginx variable/upstream names cannot
# contain hyphens). The container names they point at use hyphens, which is
# fine inside the `server` line.
# =============================================================================

# --- App 1: Compliance ----------------------------------------------------
upstream compliance_frontend {
    server compliance-frontend:3000;
}
upstream compliance_backend {
    server compliance-backend:8000;
}

# --- App 2 template (uncomment + adjust when onboarding the next app) ------
# upstream app2_frontend {
#     server app2-frontend:3002;
# }
# upstream app2_backend {
#     server app2-backend:8001;
# }

# WebSocket upgrade helper: maps the Upgrade header to the right Connection
# value (Next.js HMR/RSC and FastAPI websockets both need this).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Long-running AI agent responses must not be cut off by the proxy.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Allow file uploads to the compliance agent.
    client_max_body_size 50m;

    # --- Security headers (audit-trail 08 §5) -----------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # HSTS: only meaningful once TLS is terminated here (or upstream). Uncomment
    # after enabling HTTPS + an HTTP->HTTPS redirect on this VM.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # A restrictive CSP for the app; loosen per the frontend's real asset needs.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # --- Health endpoint --------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # =====================================================================
    # App 1: Compliance
    # IMPORTANT: the /compliance/api/ block MUST be declared BEFORE
    # /compliance/ so the API prefix is not swallowed by the frontend block.
    # =====================================================================
    location /compliance/api/ {
        # Trailing slash on proxy_pass strips the "/compliance/api/" prefix,
        # so /compliance/api/docs -> backend /docs.
        proxy_pass http://compliance_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # SANITIZED client IP (audit-trail 08 §6): OVERWRITE X-Forwarded-For with
        # the real peer ($remote_addr) instead of appending ($proxy_add_x_...).
        # The backend's IP binding reads the first XFF hop; appending would let a
        # client inject a spoofed leading hop and defeat the IP gate.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /compliance/ {
        # /compliance/ -> frontend / (Next.js).
        proxy_pass http://compliance_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================================================
    # App 2 template (uncomment + adjust when onboarding the next app)
    # =====================================================================
    # location /app2/api/ {
    #     proxy_pass http://app2_backend/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        $connection_upgrade;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /app2/ {
    #     proxy_pass http://app2_frontend/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        $connection_upgrade;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
