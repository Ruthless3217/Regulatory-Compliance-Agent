# Production / offline compose — runs PRE-BUILT images, never builds.
#
# Use this on the RHEL 9 VM (or a friend's laptop) after the images have been
# loaded with `docker load` (see scripts/deploy/load-and-up.sh). Unlike
# docker-compose.yml, there are NO `build:` blocks, so `docker compose up`
# will not try to compile anything — it just runs what was loaded.
#
# 1. Copy .env.prod.example -> .env and fill in the real secrets.
# 2. docker compose -f docker-compose.prod.yml up -d
#
# Image tags are pinned via ${IMAGE_TAG} (default v1) so the same compose file
# can run any released version. postgres/redis are stateful — they are NOT part
# of the build/release cycle; their images are saved/loaded once and kept.

services:
 postgres:
 image: pgvector/pgvector:pg15
 container_name: compliance-postgres
 restart: unless-stopped
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-compliance_user}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
 POSTGRES_DB: ${POSTGRES_DB:-compliance_db}
 # NOTE: 5432 is intentionally NOT published to the host in production.
 # Postgres is reachable only on the internal `default` network by the
 # backend. Uncomment the next two lines ONLY if you must reach it from the
 # host, and bind to loopback so it is never exposed on the VM's IP.
 # ports:
 # - "127.0.0.1:5432:5432"
 volumes:
 - postgres_data:/var/lib/postgresql/data
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance_user} -d ${POSTGRES_DB:-compliance_db}"]
 interval: 10s
 timeout: 5s
 retries: 5

 redis:
 image: redis:7-alpine
 container_name: compliance-redis
 restart: unless-stopped
 # Likewise, 6379 stays on the internal network only.
 volumes:
 - redis_data:/data
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 10s
 timeout: 3s
 retries: 3

 backend:
 image: compliance-backend:${IMAGE_TAG:-v1}
 container_name: compliance-backend
 restart: unless-stopped
 mem_limit: 2g
 cpus: 2.0
 ports:
 - "8000:8000"
 # Lets the container reach an Ollama (or any LLM endpoint) running on the
 # HOST via http://host.docker.internal:11434 — this mapping is automatic on
 # Docker Desktop (Windows/Mac) but MUST be declared on Linux/RHEL.
 extra_hosts:
 - "host.docker.internal:host-gateway"
 environment:
 # --- Datastores (internal network names, password from .env) ---
 DATABASE_URL: postgresql://${POSTGRES_USER:-compliance_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-compliance_db}
 REDIS_URL: redis://redis:6379
 # --- Main LLM provider (analysis/grading) — Azure OpenAI ---
 # For azure: LLM_BASE_URL = resource root, LLM_MODEL = deployment name,
 # routed via AsyncAzureOpenAI (api-key header + api-version + deployment).
 LLM_PROVIDER: ${LLM_PROVIDER:-azure}
 LLM_API_KEY: ${LLM_API_KEY:-}
 LLM_BASE_URL: ${LLM_BASE_URL:-}
 LLM_MODEL: ${LLM_MODEL:-}
 LLM_AZURE_API_VERSION: ${LLM_AZURE_API_VERSION:-2025-04-01-preview}
 LLM_USE_MAX_COMPLETION_TOKENS: ${LLM_USE_MAX_COMPLETION_TOKENS:-true}
 # gpt-5.4 reasoning mode rejects custom temperature → omit (default false).
 LLM_SUPPORTS_TEMPERATURE: ${LLM_SUPPORTS_TEMPERATURE:-false}
 # Reasoning effort = main cost lever (high ≈ 5x low's output tokens). Default low.
 LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
 # Safety ceiling only (billed on actual tokens). 8000 is ample at low effort.
 LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8000}
 LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-128000}
 LLM_INSECURE_TLS: ${LLM_INSECURE_TLS:-false}
 # --- Chat assistant LLM (streaming Q&A) — separate provider (Groq) ---
 # Any CHAT_LLM_* left empty inherits the main LLM_* config above.
 CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-}
 CHAT_LLM_BASE_URL: ${CHAT_LLM_BASE_URL:-}
 CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-}
 CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
 CHAT_LLM_MAX_TOKENS: ${CHAT_LLM_MAX_TOKENS:-0}
 CHAT_LLM_INSECURE_TLS: ${CHAT_LLM_INSECURE_TLS:-false}
 CHAT_LLM_REASONING_EFFORT: ${CHAT_LLM_REASONING_EFFORT:-}
 GROQ_CITATION_MODEL: ${GROQ_CITATION_MODEL:-}
 GROQ_CITATION_TPM: ${GROQ_CITATION_TPM:-12000}
 # --- RAG / embeddings ---
 OPENAI_API_KEY: ${OPENAI_API_KEY:-}
 COHERE_API_KEY: ${COHERE_API_KEY:-}
 RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-azure_cohere}
 RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-Cohere-embed-v3-multilingual}
 RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
 COHERE_EMBEDDING_MODEL: ${COHERE_EMBEDDING_MODEL:-embed-english-v3.0}
 # --- Tracing (optional) ---
 LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
 LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
 LANGCHAIN_PROJECT: "${LANGCHAIN_PROJECT:-Regulatory Compliance Agent}"
 # --- Feature flags ---
 CRITIC_ENABLED: ${CRITIC_ENABLED:-true}
 COMPLETENESS_SWEEP_ENABLED: ${COMPLETENESS_SWEEP_ENABLED:-true}
 CROSS_CHUNK_CONTEXT_ENABLED: ${CROSS_CHUNK_CONTEXT_ENABLED:-true}
 CROSS_CHUNK_CONTEXT_TOKEN_BUDGET: ${CROSS_CHUNK_CONTEXT_TOKEN_BUDGET:-8000}
 LOG_LEVEL: ${LOG_LEVEL:-INFO}
 ENVIRONMENT: production
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 volumes:
 - ./backend/uploads:/app/uploads
 - ./backend/logs:/app/logs
 - ./docs:/app/docs:ro
 - ./dataset:/app/dataset:ro

 # Daily Postgres backup sidecar — sleeps 24h between dumps, retains 14 days.
 # Manual trigger: `docker exec compliance-backup /scripts/db_backup.sh`
 db-backup:
 image: postgres:15-alpine
 container_name: compliance-backup
 restart: unless-stopped
 depends_on:
 postgres:
 condition: service_healthy
 environment:
 PGHOST: postgres
 PGPORT: "5432"
 PGUSER: ${POSTGRES_USER:-compliance_user}
 PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
 PGDATABASE: ${POSTGRES_DB:-compliance_db}
 BACKUP_DIR: /backups
 RETAIN_DAYS: "14"
 volumes:
 - ./backend/scripts:/scripts:ro # db_backup.sh + db_restore.sh
 - ./backend/backups:/backups
 entrypoint: ["sh", "-c"]
 command: ["while true; do /scripts/db_backup.sh || true; sleep 86400; done"]

 frontend:
 image: compliance-frontend:${IMAGE_TAG:-v1}
 container_name: compliance-frontend
 restart: unless-stopped
 ports:
 - "3000:3000"
 environment:
 # Runtime base for SSR fetches (server-to-server, internal network name).
 # NOTE: the BROWSER-facing API base (NEXT_PUBLIC_API_BASE) is baked at
 # BUILD time — see scripts/deploy/build-and-save.sh. If users hit the app
 # at a hostname other than localhost, rebuild with that hostname.
 INTERNAL_API_BASE: http://backend:8000
 NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-prod}
 depends_on:
 - backend

volumes:
 postgres_data:
 redis_data:
