services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: compliance-postgres
    environment:
      POSTGRES_USER: compliance_user
      POSTGRES_PASSWORD: compliance_pass
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_user -d compliance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: compliance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compliance-backend
    restart: unless-stopped
    # Resource limits so a malformed/large upload can't OOM the host (audit H7).
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://compliance_user:compliance_pass@postgres:5432/compliance_db
      REDIS_URL: redis://redis:6379
      LLM_API_KEY: ${LLM_API_KEY}
      # Pass provider config through from .env so the container matches local
      # dev (Groq). Defaults keep Groq if the vars are unset; override in .env
      # to switch providers. LLM_API_KEY may be a comma-list for key failover.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      # Completion cap. Reasoning models (nemotron via Ollama) spend output
      # tokens on thinking BEFORE the JSON answer; 4096 starves big grading
      # prompts into empty content. Override via .env.
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: "${LANGCHAIN_PROJECT:-Regulatory Compliance Agent}"
      CRITIC_ENABLED: ${CRIC_ENABLED:-true}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./docs:/app/docs:ro
      - ./dataset:/app/dataset:ro

  # Daily Postgres backup sidecar — sleeps 24h between dumps, retains 14 days.
  # Manual trigger: `docker exec compliance-backup /scripts/db_backup.sh`
  db-backup:
    image: postgres:15-alpine
    container_name: compliance-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: compliance_user
      PGPASSWORD: compliance_pass
      PGDATABASE: compliance_db
      BACKUP_DIR: /backups
      RETAIN_DAYS: "14"
    volumes:
      - ./backend/scripts/db_backup.sh:/scripts/db_backup.sh:ro
      - ./backend/backups:/backups
    entrypoint: ["sh", "-c"]
    command: ["while true; do /scripts/db_backup.sh || true; sleep 86400; done"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time so Next.js bakes the rewrites destination correctly.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        INTERNAL_API_BASE: http://backend:8000
    container_name: compliance-frontend
    ports:
      - "3000:3000"
    environment:
      # Runtime so lib/api.ts can pick INTERNAL_API_BASE for SSR fetches.
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      INTERNAL_API_BASE: http://backend:8000
      NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-dev}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
